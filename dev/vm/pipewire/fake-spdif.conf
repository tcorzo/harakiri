# The fake S/PDIF sink (research 01, section 13.2). The SPA ALSA sink lists IEC958 formats only for a
# device whose name starts with iec958 or hdmi, so the null PCM in ~/.asoundrc is iec958_null.
# Spell the codecs as in spa/param/audio/iec958-types.h (TrueHD, DTS-HD): PipeWire drops TRUEHD and
# DTSHD silently. node.group joins the default Dummy-Driver, which clocks the sink without hardware.
context.objects = [
  { factory = adapter args = {
      factory.name = api.alsa.pcm.sink  node.name = fake-spdif  node.description = "Fake S/PDIF"
      media.class = Audio/Sink  api.alsa.path = "iec958_null"  node.group = pipewire.dummy
      iec958.codecs = [ PCM AC3 EAC3 TrueHD DTS DTS-HD ]
      audio.position = [ FL FR FC LFE RL RR SL SR ] } }
]
