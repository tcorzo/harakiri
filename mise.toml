# 2026.9.16 is the first mise that reads lockfile_version 3. Older ones rewrite mise.lock as version 2 and drop every checksum.
min_version = "2026.9.16"

[settings]
lockfile = true

[tools]
bun = "1.4.4"
node = "26.13.0"
hk = "2.10.0"
"github:quietvoid/dovi_tool" = "2.3.4"
"github:quietvoid/hdr10plus_tool" = "1.7.2"

[env]
_.file = ".env"

[tasks.setup]
description = "Install deps and the browser tests' Chromium, register git hooks, build harakiri's mpv once and check the harness tools"
shell = "bash -euo pipefail -c"
run = """
bun install --frozen-lockfile
mise run browser:install
hk install --global --mise
git config --get-regexp '^hook\\.' >/dev/null || { echo 'hk hooks are not registered' >&2; exit 1; }
mise run mpv:build
mise run doctor
"""

[tasks.doctor]
description = "Check the tools the validation harness needs: ffmpeg, the headless compositors, podman, dovi_tool and hdr10plus_tool"
shell = "bash -euo pipefail -c"
run = "bun run --filter @harakiri/harness doctor"

[tasks.dev]
description = "Run the desktop app with hot reload"
depends = ["mpv:build"]
dir = "{{config_root}}/apps/desktop"
run = "../../scripts/bounded.sh dev 4G -- bun run dev"

[tasks.live]
description = "Start impeccable's live helper: while it runs, the dev app (mise run dev) shows the live widget"
run = "bash scripts/impeccable-live.sh start"

[tasks."live:stop"]
description = "Stop impeccable's live helper; the dev app drops the live widget"
run = "bash scripts/impeccable-live.sh stop"

[tasks.lint]
description = "Lint with oxlint (type-aware)"
run = "bun x oxlint --type-aware"

[tasks.fmt]
description = "Format with oxfmt"
run = "bun x oxfmt"

[tasks."fmt:check"]
description = "Fail when any file is not formatted"
run = "bun x oxfmt --check"

[tasks.typecheck]
description = "Typecheck every workspace"
run = "scripts/bounded.sh typecheck 4G -- bun x tsc -b"

[tasks.test]
description = "Run unit and harness tests that need no network or display"
run = "scripts/bounded.sh test 3G -- bun x vitest run --maxWorkers=2"

[tasks."test:browser"]
description = "Run the renderer's browser tests (*.browser.test.tsx) in headless Chromium; mise run test runs them too"
run = "scripts/bounded.sh browser 2G -- bun x vitest run --project desktop-browser --maxWorkers=2"

[tasks."browser:install"]
description = "Download the Chromium the browser tests run in, the build bun.lock's Playwright pins (needs the network; setup runs it)"
dir = "{{config_root}}/apps/desktop"
# Playwright's browser cache is shared with other projects: this install only adds to it, and skips
# the garbage collection that would delete builds it does not know are still wanted.
run = "PLAYWRIGHT_SKIP_BROWSER_GC=1 bun x playwright install --no-shell chromium"

[tasks.watchdog]
description = "Watch harakiri's memory and stop the largest harakiri scope when the system runs low"
run = "WATCHDOG_VERBOSE=1 scripts/watchdog.sh"

[tasks."test:fate"]
description = "Prove DTS-HD MA, DTS:X and TrueHD Atmos passthrough on FFmpeg test-suite samples (HARAKIRI_FATE_DIR, default .cache/fate from media:fetch-fate)"
run = "HARAKIRI_FATE_DIR=${HARAKIRI_FATE_DIR:-.cache/fate} scripts/bounded.sh fate 3G -- bun x vitest run --config vitest.tiers.config.ts --project 'fate:*' --maxWorkers=2"

[tasks."test:live"]
description = "Run the live tier against a real Jellyfin (JELLYFIN_DEV_URL/_USER/_PASSWORD, default the dev container); it writes resume points and sessions"
run = "scripts/bounded.sh live 3G -- bun x vitest run --config vitest.tiers.config.ts --project 'live:*' --maxWorkers=2"

[tasks."media:gen"]
description = "Generate the synthetic Jellyfin library into .cache/corpus (adds the FATE tier when .cache/fate holds it)"
run = "scripts/bounded.sh corpus 2G -- bun packages/harness/src/corpus/cli.ts gen"

[tasks."media:fetch-fate"]
description = "Fetch the pinned FFmpeg FATE samples into .cache/fate (HARAKIRI_FATE_MIRROR overrides the host); fails on any miss"
run = "bun packages/harness/src/corpus/cli.ts fetch-fate"

[tasks."test:corpus"]
description = "Check the running dev Jellyfin's scan of the corpus against the catalog's classification (fails when unreachable)"
run = "bun packages/harness/src/corpus/cli.ts classify --wait 300"

[tasks."jellyfin:up"]
description = "Start the dev Jellyfin (JELLYFIN_DEV_LIBRARY=corpus|own, read-only, 127.0.0.1:8096) and run its idempotent bootstrap"
shell = "bash -euo pipefail -c"
run = """
if [ "${JELLYFIN_DEV_LIBRARY:-corpus}" = corpus ] && [ ! -f "${HARAKIRI_CORPUS_DIR:-.cache/corpus}/corpus.json" ]; then
  mise run media:gen
fi
dev/jellyfin/jellyfin.sh up
bun dev/jellyfin/bootstrap.ts
"""

[tasks."jellyfin:down"]
description = "Stop the dev Jellyfin, keeping its state"
run = "dev/jellyfin/jellyfin.sh down"

[tasks."test:platform"]
description = "Run the platform tier inside the dev/vm microVM guest (KVM; the first run downloads smolvm and provisions the guest)"
run = "dev/vm/guest.sh exec -- bun x vitest run --config vitest.tiers.config.ts --project 'platform:*' --maxWorkers=2"

[tasks."test:contract"]
description = "Prove a real Jellyfin direct plays every fixture and the whole library under harakiri's profile (JELLYFIN_DEV_URL/_USER/_PASSWORD)"
run = "scripts/bounded.sh contract 2G -- bun x vitest run --config vitest.tiers.config.ts --project 'contract:*' --maxWorkers=2"

[tasks."jellyfin:gen"]
description = "Regenerate the Jellyfin client from the pinned OpenAPI spec"
dir = "{{config_root}}/packages/jellyfin"
run = "bun run gen"

[tasks."fidelity:table"]
description = "Regenerate docs/fidelity/compatibility.md from the fidelity engine's scenarios"
run = "bun packages/fidelity/src/table-cli.ts docs/fidelity/compatibility.md"

[tasks."steam:art"]
description = "Render the Steam library artwork in apps/desktop/build/steam from the README's icon and wordmark"
run = "bun apps/desktop/build/steam/render.ts"

[tasks."lint:skips"]
description = "Fail when a test file can skip instead of living in a live, contract or FATE tier"
run = "bun scripts/lint-skips.ts"

[tasks.e2e]
description = "Build the app and run the Playwright e2e against a real Jellyfin container on the corpus: the specs tagged @host run on the host under nested KWin, the rest inside the dev/vm guest (HARAKIRI_E2E_SERVER=<url> runs it against another server)"
depends = ["mpv:build"]
dir = "{{config_root}}/apps/desktop"
shell = "bash -euo pipefail -c"
# Electron 45 has no install script: it downloads its binary on first use. install-electron does
# that here, on the host, so the guest finds it in node_modules through the mount.
# A red host half still runs the guest half, and the task fails when either did.
run = """
if [ -z "${HARAKIRI_E2E_SERVER:-}" ]; then mise run media:fetch-fate; fi
bun x install-electron
../../scripts/bounded.sh build 3G -- bun run build
host=0 guest=0
../../scripts/bounded.sh e2e 4G -- bash e2e/headless.sh --project=host || host=$?
../../dev/vm/guest.sh exec --cwd apps/desktop -- bash e2e/headless.sh --project=guest || guest=$?
if [ "$host" != 0 ] || [ "$guest" != 0 ]; then
  echo "e2e failed: host project exit $host, guest project exit $guest" >&2
  exit 1
fi
"""

# Stages the current recipe's mpv build in .cache/package/mpv, which electron-builder packs as
# resources/mpv. electron-builder's YAML cannot name .cache/mpv/<recipe-hash> itself.
[tasks.package]
description = "Build the Linux AppImage, with harakiri's mpv in resources/mpv, and its update metadata into apps/desktop/dist"
depends = ["mpv:build"]
dir = "{{config_root}}"
shell = "bash -euo pipefail -c"
run = """
bundle="$(bun packages/mpv/src/bundle-dir.ts)"
rm -rf .cache/package/mpv
mkdir -p .cache/package
cp -a "$bundle" .cache/package/mpv
cd apps/desktop
../../scripts/bounded.sh package 4G -- bun run package
"""

[tasks."package:icons"]
description = "Render the AppImage icons in apps/desktop/build/icons from docs/assets/readme/icon.svg (needs ImageMagick with librsvg)"
dir = "{{config_root}}"
run = "for s in 256 512; do magick -background none RSVG:docs/assets/readme/icon.svg -resize ${s}x${s} -strip PNG32:apps/desktop/build/icons/${s}x${s}.png; done"

[tasks."e2e:down"]
description = "Stop and remove this checkout's e2e Jellyfin container (harakiri-jellyfin-e2e-<checkout id>), keeping its scan in .cache/jellyfin-e2e"
shell = "bash -euo pipefail -c"
# Also removes the shared harakiri-jellyfin-e2e that checkouts ran before each had its own, when it
# runs on this checkout's state; one on another checkout's state is that checkout's to stop. The
# names are resolved on their own lines, so a failure stops the task instead of passing an empty
# name, which jellyfin.sh would read as the dev server's.
run = """
cli=packages/harness/src/checkout-cli.ts
name="$(bun "$cli" e2e-name)"
legacy="$(bun "$cli" e2e-legacy-name)"
owned="$(bun "$cli" e2e-legacy-owned)"
JELLYFIN_DEV_NAME="$name" JELLYFIN_DEV_STATE=.cache/jellyfin-e2e dev/jellyfin/jellyfin.sh down
if [ "$owned" = yes ]; then
  podman rm -f -t 20 "$legacy" >/dev/null
  echo "$legacy (the shared e2e server of older checkouts, on this checkout's state) removed"
fi
"""

[tasks."lint:private"]
description = "Fail when a file holds workstation paths, owner domains or library titles (.private-denylist)"
run = "bun scripts/lint-private.ts"

[tasks."lint:host"]
description = "Fail when feature code names a platform or reads the host environment (only src/main/host may)"
run = "bun scripts/lint-host.ts"

[tasks."lint:pr-title"]
description = "Fail when a PR title is not a Conventional Commit (PR_TITLE, else the current branch's PR)"
shell = "bash -euo pipefail -c"
run = """
title="${PR_TITLE:-$(gh pr view --json title -q .title)}"
msg="$(mktemp)"; trap 'rm -f "$msg"' EXIT
printf '%s\n' "$title" > "$msg"
hk util check-conventional-commit "$msg" || {
  echo "PR title '$title' must be a Conventional Commit, like the commits (hk commit-msg): 'feat: ...', 'fix(scope): ...'. Retitle with: gh pr edit --title '<type>: <summary>'" >&2
  exit 1
}
"""

# podman's build containers run outside the bounded scope (in app.slice), so --memory caps them.
[tasks."mpv:build"]
description = "Build harakiri's mpv (mpv 0.42.0, libplacebo 7.387.0 with shaderc 2026.4 static, FFmpeg 9.0.2, SDL2 2.32.10, curl 8.23.0) into .cache/mpv/<recipe-hash>; a no-op when that build exists"
shell = "bash -euo pipefail -c"
run = """
out="$(bun packages/mpv/src/bundle-dir.ts)"
if [ -x "$out/mpv" ]; then echo "mpv build present: $out"; exit 0; fi
command -v podman >/dev/null || { echo 'mpv:build needs podman (dnf install podman)' >&2; exit 1; }
mpv/fetch.sh .cache/mpv/src
set -a; . mpv/versions.env; set +a
rm -rf "$out.partial"
scripts/bounded.sh mpv-build 6G -- podman build --memory 5g --memory-swap 5g \
  --build-arg BASE_IMAGE="$BASE_IMAGE" --build-arg JOBS="${HARAKIRI_MPV_JOBS:-4}" \
  -v "$PWD/.cache/mpv/src:/src:ro,Z" -f mpv/Containerfile -o "type=local,dest=$out.partial" mpv
rm -rf "$out"
mv "$out.partial" "$out"
find .cache/mpv -mindepth 1 -maxdepth 1 -type d ! -name src ! -name "$(basename "$out")" -exec rm -rf {} +
echo "mpv build ready: $out"
"""

# A release uploads apps/desktop/dist's four assets: the AppImage, latest-linux.yml, the source tar
# and SHA256SUMS, which lists the other three that are there.
[tasks."mpv:source"]
description = "Build apps/desktop/dist/harakiri-mpv-source.tar, the corresponding source of harakiri's mpv (the recipe, its tarballs and its Fedora source RPMs; podman and the network fetch what .cache lacks), check it, and update apps/desktop/dist/SHA256SUMS"
depends = ["mpv:build"]
dir = "{{config_root}}"
shell = "bash -euo pipefail -c"
run = """
bundle="$(bun packages/mpv/src/bundle-dir.ts)"
scripts/bounded.sh mpv-source 2G -- mpv/source.sh "$bundle" apps/desktop/dist/harakiri-mpv-source.tar
cd apps/desktop/dist
assets=()
for asset in harakiri-x86_64.AppImage latest-linux.yml harakiri-mpv-source.tar; do
  [ ! -f "$asset" ] || assets+=("$asset")
done
sha256sum "${assets[@]}" > SHA256SUMS
cat SHA256SUMS
"""

[tasks.check]
description = "Everything CI gates on"
depends = ["lint", "fmt:check", "lint:skips", "lint:private", "lint:host", "typecheck", "test"]

# The dev/vm microVM guest. guest.sh is its only entry point.
[tasks."vm:up"]
description = "Start the dev/vm microVM guest (KVM; the first run downloads smolvm 1.35.5 and provisions Fedora 44 into .cache/vm)"
run = "dev/vm/guest.sh up"

[tasks."vm:down"]
description = "Stop the dev/vm guest, keeping its provisioned disk in .cache/vm"
run = "dev/vm/guest.sh down"

[tasks."package:check"]
description = "Check apps/desktop/dist: latest-linux.yml matches the AppImage and the version, the feed is public GitHub, runtime deps are packed, and the bundled mpv"
run = "bun scripts/check-release.ts"

# The release job's runner (ubuntu-24.04, glibc 2.39) is older than the bundle's Fedora 44 floor,
# so it cannot run the shipped mpv. package:check runs it in this image when
# HARAKIRI_MPV_CHECK_IMAGE names it: the build's own base image, plus the package that provides
# each host lib the bundle needs, from the same frozen release repo the build installs from.
[tasks."package:check-image"]
description = "Build localhost/harakiri-mpv-check, the Fedora 44 image package:check runs the shipped mpv in when HARAKIRI_MPV_CHECK_IMAGE names it (the release job does)"
depends = ["mpv:build"]
dir = "{{config_root}}"
shell = "bash -euo pipefail -c"
run = """
command -v podman >/dev/null || { echo 'package:check-image needs podman (dnf install podman)' >&2; exit 1; }
set -a; . mpv/versions.env; set +a
mapfile -t provides < <(bun packages/mpv/src/host-needs-cli.ts)
[ -n "${provides[0]:-}" ] || { echo 'the mpv build needs no host lib: is it built?' >&2; exit 1; }
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
{
  echo "FROM $BASE_IMAGE"
  printf '%s' "RUN dnf -y --disablerepo='*' --enablerepo=fedora --setopt=install_weak_deps=False install"
  printf " '%s'" "${provides[@]}"
  echo ' && dnf clean all'
} > "$tmp/Containerfile"
scripts/bounded.sh check-image 3G -- podman build --memory 2g --memory-swap 2g \
  -t localhost/harakiri-mpv-check -f "$tmp/Containerfile" "$tmp"
echo "mpv check image ready: localhost/harakiri-mpv-check"
"""

[tasks."package:check-hosts"]
description = "Opt-in: run the AppImage's mpv bundle on the Bazzite image in podman (HOST_IMAGES overrides it; the image is several GB)"
run = "scripts/bounded.sh hosts 3G -- scripts/check-hosts.sh"
