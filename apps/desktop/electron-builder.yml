appId: dev.harakiri.desktop
productName: harakiri
# electron-builder derives the update cache dir (app-update.yml updaterCacheDirName) from the package
# name and ignores publish.updaterCacheDirName; renaming it after release would orphan users' update caches.
extraMetadata:
  name: harakiri
directories:
  output: dist
files:
  - out/**
  - package.json
# Steam library artwork, copied into grid/ when harakiri adds itself to Steam.
extraResources:
  - from: build/steam
    to: steam
    filter: ["*.png"]
  # harakiri's mpv build, which the app plays with (resources/mpv/mpv). `mise run package` stages
  # the current recipe's .cache/mpv/<recipe-hash>/ here.
  - from: ../../.cache/package/mpv
    to: mpv
# harakiri's own license, next to Electron's LICENSE.electron.txt and LICENSES.chromium.html.
extraFiles:
  - from: ../../LICENSE
    to: LICENSE
# Writes latest-linux.yml and embeds resources/app-update.yml. Uploading is release.yml's job (--publish never).
publish:
  provider: github
  owner: tcorzo
  repo: harakiri
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: AudioVideo
  # Defaults to the scoped package name "@harakiri/desktop", which electron-builder rejects.
  executableName: harakiri
  # No version in the name: AppImageUpdater overwrites the running file in place only then.
  artifactName: harakiri-${arch}.AppImage
